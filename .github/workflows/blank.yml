name: Android APK Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: milk-collection-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14            echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          fi

          if [ -d "$ANDROID_HOME/cmdline-tools/16.0/bin" ]; then
            echo "$ANDROID_HOME/cmdline-tools/16.0/bin" >> $GITHUB_PATH
          fi

          if [ -d "$ANDROID_HOME/platform-tools" ]; then
            echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          fi

          ls -d "$ANDROID_HOME"/* 2>/dev/null || true

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER_BIN="$(find "$ANDROID_HOME" -path '*/bin/sdkmanager' -type f | head -n 1)"
          if [ -z "$SDKMANAGER_BIN" ]; then
            echo "sdkmanager not found"
            exit 1
          fi

          echo "Using sdkmanager at: $SDKMANAGER_BIN"
          yes | "$SDKMANAGER_BIN" --licenses || true
          "$SDKMANAGER_BIN" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Make gradlew executable
        shell: bash
        run: chmod +x ./gradlew

      - name: Build debug APK
        shell: bash
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: milk-collection-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
